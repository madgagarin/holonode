[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holonode"
version = "1.0.0"
description = "Worker SDK for the Holarchy orchestrator."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [
    {name = "Dmitry Gagarin aka madgagarin", email = "madgagarin@gmail.com"},
]
keywords = ["worker", "sdk", "orchestrator", "distributed", "task-queue", "rxon", "hln", "holarchy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "rxon>=1.0.0,<2.0.0",
    "aiohttp~=3.14.3",
    "python-json-logger~=4.2.0",
    "aiofiles~=25.1.0",
    "orjson~=3.12.0",
]

[project.scripts]
worker = "holonode.__main__:main"

[project.optional-dependencies]
s3 = ["obstore>=0.11.1,<1.0.0"]
pydantic = ["pydantic>=2.13.4,<3.0.0"]
metrics = [
    "opentelemetry-api>=1.44.0,<2.0.0",
    "opentelemetry-sdk>=1.44.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.44.0,<2.0.0",
    "opentelemetry-semantic-conventions>=0.50b0",
]
dev = [
    "holonode[s3,pydantic,metrics]",
    "pytest~=9.1.0",
    "pytest-asyncio~=1.4.0",
    "aioresponses~=0.7.9",
    "pytest-mock",
    "types-aiofiles~=25.1.0.20260518",
    "watchdog",
    "mutmut~=3.8.0",
]

[project.urls]
"Homepage" = "https://github.com/madgagarin/holonode"
"Bug Tracker" = "https://github.com/madgagarin/holonode/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"holonode" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["mutants", ".mutmut-cache", ".venv", "build", "dist"]
markers = [
    "e2e: marks tests as end-to-end tests",
]
pythonpath = "src"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning"
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "A", "SIM", "C4", "PLC", "UP", "TID", "E402"]
ignore = ["PLC0415"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["input", "id"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"json".msg = "Use 'orjson' instead of standard 'json' for better performance."

[tool.ruff.lint.pyupgrade]
# Enforce native union types (X | Y) instead of Union/Optional
keep-runtime-typing = false

[tool.ruff.lint.isort]
known-first-party = ["holonode"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
packages = ["holonode"]
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
warn_return_any = true
disallow_any_unimported = false
exclude = ["tests/"]

[tool.coverage.run]
source = ["src/holonode"]

[tool.mutmut]
source_paths = ["src/holonode"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-q", "--no-header", "--tb=no", "--ignore=mutants"]
mutate_only_covered_lines = true
use_git_change_detection = true
